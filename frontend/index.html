<!DOCTYPE html>

<head>

<script>
  (function () {
    var saved = localStorage.getItem('lifeops-theme') || 'system';
    document.documentElement.dataset.theme = saved;
  })();

<body>

  <div class="topbar">
    <div class="logo">LifeOps</div>
    <div style="display:flex; gap:8px; align-items:center;">
      <button id="theme-toggle-btn" title="Cycle theme" aria-label="Cycle color theme"></button>
      <button id="focus-mode-btn" title="Focus mode (f)" style="font-size:11px;">Focus</button>
      <button id="shortcuts-help-btn" type="button">Keyboard</button>
      <button class="primary" id="quick-add-btn">+ Quick Add <span class="muted" style="font-weight:400;">(n)</span></button>
    </div>
  </div>
  <div class="body-grid">
    <nav class="sidebar">
      <div class="nav-group-label">Navigate</div>
      <a class="nav-link" data-route="/home"       href="#/home"><span class="label">Home</span></a>
      <a class="nav-link" data-route="/insights"   href="#/insights"><span class="label">Dashboard</span></a>
      <a class="nav-link" data-route="/areas"      href="#/areas"><span class="label">Areas</span></a>
      <a class="nav-link" data-route="/dreams"     href="#/dreams"><span class="label">Dreams</span></a>
      <a class="nav-link" data-route="/projects"   href="#/projects"><span class="label">Projects</span></a>
      <a class="nav-link" data-route="/tasks"      href="#/tasks"><span class="label">Tasks</span></a>
      <a class="nav-link" data-route="/habits"     href="#/habits"><span class="label">Habits</span></a>
      <a class="nav-link" data-route="/calendar"   href="#/calendar"><span class="label">Calendar</span></a>
      <div class="sidebar-spacer"></div>
      <div class="sidebar-divider"></div>
      <a class="nav-link" data-route="/settings"   href="#/settings"><span class="label">Settings</span></a>
    </nav>
    <main class="main-panel" id="main-panel">
      <div class="empty-state">Loading...</div>
    </main>
  </div>
</div>

<div class="detail-overlay" id="detail-overlay"></div>
<div class="detail-panel" id="detail-panel"></div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal"></div>
</div>

<script src="/js/theme.js"></script>
<script src="/js/api.js"></script>
<script src="/js/router.js"></script>
<script src="/js/modal.js"></script>
<script src="/js/charts/charts.js"></script>
<script src="/js/views/home.js"></script>
<script src="/js/views/dashboard.js"></script>
<script src="/js/views/areas.js"></script>
<script src="/js/views/dreams.js"></script>
<script src="/js/views/projects.js"></script>
<script src="/js/views/tasks.js"></script>
<script src="/js/views/habits.js"></script>
<script src="/js/views/calendar.js"></script>
<script src="/js/views/insights.js"></script>
<script src="/js/views/settings.js"></script>
<script src="/js/focus.js"></script>
<script src="/js/review.js"></script>
<script src="/js/quickadd.js"></script>
<script>
  // Feature 5: Markdown renderer (sanitized)
  function renderMd(text) {
    if (!text || typeof marked === 'undefined') return escapeHtml(text || '');
    const template = document.createElement('template');
    template.innerHTML = marked.parse(text, { breaks: true, gfm: true });
    const allowedTags = new Set([
      'P', 'BR', 'HR', 'STRONG', 'EM', 'DEL', 'CODE', 'PRE', 'BLOCKQUOTE',
      'UL', 'OL', 'LI', 'H1', 'H2', 'H3', 'H4', 'A', 'TABLE', 'THEAD',
      'TBODY', 'TR', 'TH', 'TD',
    ]);
    [...template.content.querySelectorAll('*')].reverse().forEach((node) => {
      if (!allowedTags.has(node.tagName)) {
        node.replaceWith(...node.childNodes);
        return;
      }
      [...node.attributes].forEach((attribute) => {
        if (node.tagName !== 'A' || attribute.name !== 'href') node.removeAttribute(attribute.name);
      });
      if (node.tagName === 'A' && node.hasAttribute('href')) {
        const href = node.getAttribute('href').trim();
        if (!/^(https?:|mailto:|\/|#|\.\.?\/)/i.test(href)) node.removeAttribute('href');
        else node.setAttribute('rel', 'noopener noreferrer');
      }
    });
    return template.innerHTML;
  }

  Theme.initToggleButton(document.getElementById('theme-toggle-btn'));
  document.getElementById('quick-add-btn').addEventListener('click', openQuickAdd);
  document.getElementById('modal-overlay').addEventListener('click', (e) => {
    if (e.target.id === 'modal-overlay') closeModal();
  });
  document.getElementById('focus-mode-btn').addEventListener('click', () => FocusMode.toggle());
  document.getElementById('shortcuts-help-btn').addEventListener('click', () => {
    appAlert(
      'Global: N opens Quick Add; F toggles Focus mode; Escape exits Focus mode or closes the topmost dialog.\\n\\n' +
      'Quick Add: Up and Down move through suggestions; Enter selects; Escape closes suggestions.\\n\\n' +
      'Habits: Tab enters the weekly grid (one tab stop); arrow keys move between scheduled days and habits; Enter or Space toggles a day; O opens habit details.',
      { title: 'Keyboard shortcuts' }
    );
  });

  Router.start();
  FocusMode.init();
</script>
</body>
</html>
